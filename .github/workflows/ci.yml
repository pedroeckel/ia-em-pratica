name: Qualidade e publicação
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Verificar (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            python: '3.12'
          - os: ubuntu-latest
            node: '24'
            python: '3.13'
          - os: windows-latest
            node: '22'
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- CATALOG.md
      - run: python -m unittest discover -s tests -v
        working-directory: examples/fluxo-completo/carrinho
      - run: git diff --check


  tag:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Fixar edição aprovada
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const config = JSON.parse(await readFile('catalog/config.json', 'utf8'));
          const pkg = JSON.parse(await readFile('package.json', 'utf8'));
          const plugin = JSON.parse(await readFile('.claude-plugin/plugin.json', 'utf8'));
          const market = JSON.parse(await readFile('.claude-plugin/marketplace.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(config.version) || [pkg.version, plugin.version, market.metadata.version].some(v => v !== config.version)) throw new Error('Versões da edição divergem');
          const tag = 'v' + config.version;
          const base = 'https://api.github.com/repos/' + process.env.RELEASE_REPOSITORY;
          const headers = { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const current = await fetch(base + '/git/ref/tags/' + tag, { headers });
          if (current.ok) {
            const ref = await current.json();
            if (ref.object.type !== 'commit' || ref.object.sha !== process.env.RELEASE_SHA) throw new Error('Tag existente identifica outra revisão; aumente a versão, sem sobrescrever a tag');
            console.log('Tag já corresponde ao commit: ' + tag);
          } else if (current.status === 404) {
            const created = await fetch(base + '/git/refs', { method: 'POST', headers, body: JSON.stringify({ ref: 'refs/tags/' + tag, sha: process.env.RELEASE_SHA }) });
            if (!created.ok) throw new Error('Falha ao fixar edição: HTTP ' + created.status);
            console.log('Tag criada: ' + tag);
          } else throw new Error('Falha ao consultar tag: HTTP ' + current.status);
          NODE

  build:
    needs: [check, tag]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
